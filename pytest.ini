[pytest]
pythonpath = .
testpaths = tests
markers =
    allow_proxy_probe: test drives the real paypal_proxy._probe_proxy_network and
        only fakes the layer below it (no real network). Opts out of the
        autouse guard in tests/conftest.py.
    allow_real_runtime: test needs the real runtime/ tree (accounts.sqlite3 etc.)
        and opts out of the autouse re-rooting in tests/conftest.py.
