[package]
name = "normalize-proxy-url-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of hot proxy parsing/redaction/session functions in `sms_tool/proxy/entry.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fancy-regex = "0.14"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
regex = "1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
