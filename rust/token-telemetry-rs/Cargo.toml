[package]
name = "token-telemetry-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `_parse_token_claims_and_hash` from `sms_tool/observability/token_telemetry.py`, managed by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"


[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
