[package]
name = "session-builder-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `_session_token_from_cookie_header` in `sms_tool/session/builder.py`, managed by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }


[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
