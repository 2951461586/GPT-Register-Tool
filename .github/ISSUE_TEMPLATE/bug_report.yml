---
name: Bug report
description: 报告一个缺陷（注册 / 支付 / 桌面端 / 文档）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看两处，多半能省一轮往返：

        - `docs/current/faq.md`（FAQ / 已知限制）：无试用、iCloud 收不到码、
          passwordless 不设密码、2FA 无 UI 入口、提链 `unusual activity`、
          导出文件导入 —— 都已经给过结论。
        - [文档索引](https://github.com/2951461586/GPT-Register-Tool/tree/main/docs)
          （排障手册 / 当前模块契约 / 边界规则）

        **不要贴凭据**：代理口令、API key、邮箱密码、refresh token、access/session token、
        cookie、TOTP secret 都请先替换成 `***`。日志里的代理串请把 `user:pass@` 换成
        `***:***@`，粘之前过一遍。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果；报错原文照贴（凭据仍要打码）。
      placeholder: |
        期望：10 个账号全部 registered
        实际：第 4 个停在 email_otp_send_stuck，其余成功
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: 涉及哪条链路
      options:
        - 协议注册（protocol 驱动）
        - 浏览器注册（playwright / camoufox / cloak / roxy）
        - 邮箱 / OTP（ReMail / iCloud / CFWorker / Graph / IMAP）
        - 协议支付 / 支付链接提取
        - 账号管理与测活
        - WPF 桌面端（界面 / IPC / 托盘）
        - 代理池 / 指纹
        - 构建、打包、发布产物
        - 文档
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布标签（`v2026.11.12`）、`git describe --tags`，或桌面端「关于」里的版本号
      placeholder: v2026.11.12
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`python -m sms_tool --doctor --json` 输出"
      description: |
        这一条最省时间：它包含 python/node/playwright/curl_cffi 版本、Sentinel bundle 哈希与
        一次离线铸 token、配置分片来源、邮箱与接码供应商就绪情况。
        **贴之前请删掉其中的路径里的用户名**（如 `C:\Users\<you>\...`）。
      render: json
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 完整日志
      description: |
        **从启动那行到失败点的全部输出**（不要只截头部或尾部），含 `[Error]` / 错误码 /
        HTTP 状态码的行必须保留。桌面端用「打开日志」复制；CLI 请把 stdout+stderr 一起重定向到文件。
        账号级失败请看那一行的 `error` / `failure_class` / `retry_disposition` 三个字段。
      render: text
    validations:
      required: true

  - type: input
    id: proxy
    attributes:
      label: 出口
      description: |
        国家 / 类型（住宅 or 机房）/ 是否每号换 IP / 池内第几个出口。
        只写会话名或端口即可，**不要贴账号密码**。
      placeholder: US 住宅 · 每号独立 IP · 池内第 3 个出口
    validations:
      required: true

  - type: dropdown
    id: mailbox
    attributes:
      label: 邮箱来源
      options:
        - ReMail（长效购买 / 接码）
        - iCloud 接码链接
        - CFWorker 临时邮箱
        - Smailr
        - 邮箱池（Outlook / Hotmail / Graph）
        - 通用 IMAP
        - 自建域名邮箱
        - 不涉及邮箱
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 24H2 / Python 3.12.15 / Node 22.20.0

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 日志与配置片段里没有凭据、cookie、token 或可用的邮箱地址
          required: true
        - label: 这是缺陷而不是上游服务的行为变化（账号被停用、库存售罄等），且 FAQ 里没有现成结论
          required: true
