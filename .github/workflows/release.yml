name: release

# Publishing a tag *is* the release procedure: the three assets users download
# (setup exe, portable zip, sha256) are built here instead of by hand.
#
# Why this exists: the 2026-11-12 release was packaged manually and the manual
# path already produced both classic failure modes in this repo's history -- an
# asset that was never uploaded, and an asset built from a tree that had
# moved on since the tag. The build is deterministic from the tag
# (`git describe` is the version source in `scripts/build_installer.ps1`),
# so this job only has to start at the right commit and publish the bytes.
#
# Release notes are NOT generated: `docs/releases/release-<tag>.md` is a
# required input (the repo's own documentation rule). A tag without that
# file fails here rather than publishing an empty release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v2026.11.12"
        required: true
        type: string
      publish:
        description: "Upload the assets to the GitHub release"
        required: false
        type: boolean
        default: false

# Least privilege, plus the one write this job needs.
permissions:
  contents: write

# Serialise per tag: a re-run must not cancel the run it replaces.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # A manual run must build the tag it names, not whatever `github.ref`
          # happens to be (a branch, when dispatched from the UI).
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          # See ci.yml: v6.1.0 defaults `check-latest` to true, which would
          # install a newer SDK than global.json names. The release must be
          # built by the pinned toolkit.
          check-latest: false
          cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          # No cache input at all: this job's output is what users download and
          # a poisoned pip cache would change the shipped bytes
          # (zizmor:cache-poisoning). ~40 s is not worth that. `cache: false` is
          # NOT the spelling for "no cache" -- setup-python rejects it at
          # runtime ("Caching for 'false' is not supported") and kills the job
          # in 40 s, which is how the first tag-driven release died on
          # 2026-11-20. Omitting the input is what disables it.

      - name: Resolve version and release note
        shell: pwsh
        env:
          # Context data reaches the script through the environment only.
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}(\.\d+)?$') {
            throw "Unsupported tag format: $tag (want vYYYY.MM.DD[.N])"
          }
          $version = $tag.TrimStart('v')
          $notes = "docs/releases/release-$tag.md"
          if (-not (Test-Path $notes)) {
            throw "Missing release note $notes (one file per published tag)."
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "NOTES=$notes" >> $env:GITHUB_ENV
          Write-Host "tag=$tag version=$version notes=$notes"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      # Downloads the pinned CPython named by `scripts/runtime_manifest.json`,
      # checks its SHA-256 before extracting, then pip-installs
      # requirements.txt into it. A release build must not silently fall
      # back to `-SkipBundledPython`.
      - name: Stage the bundled CPython runtime
        shell: pwsh
        run: .\scripts\stage_python_runtime.ps1 -RepoRoot .

      - name: Build installer + portable zip
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version $env:VERSION

      # The checksum file is generated by the build script; this proves the
      # three files agree before anything is published.
      #
      # The manifest is located by GLOB, not by re-deriving its name: the build
      # script owns that naming (`GPT-Register-Tool-v<version>.sha256.txt`, see
      # `$safeVersion` in `scripts/build_installer.ps1`). This step used to say
      # `GPT-Register-Tool-$env:VERSION.sha256.txt` -- no `v` -- and the first
      # tag-driven release died here on 2026-11-20 with
      # "Cannot find path ...\GPT-Register-Tool-2026.11.20.sha256.txt". The
      # count guard keeps a stale manifest from being silently ignored.
      - name: Verify the assets against their checksums
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'dist/release'
          $pattern = 'GPT-Register-Tool-*.sha256.txt'
          $manifests = @(Get-ChildItem -Path $dir -Filter $pattern -File)
          if ($manifests.Count -ne 1) {
            throw "expected one checksum manifest, found $($manifests.Count)"
          }
          Write-Host "manifest: $($manifests[0].Name)"
          Get-Content $manifests[0].FullName | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0]
            $name = $parts[1].Trim()
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) {
              throw "manifest names a missing asset: $name"
            }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash
            if ($actual -ne $expected) { throw "checksum mismatch: $name" }
            Write-Host "ok $name"
          }

      # Always keep the bytes, even for a dry run: the desktop host is built for
      # win-x64 and nobody can rebuild an installer from a log.
      # v7.0.2; Dependabot moves the digest and keeps this comment.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-${{ inputs.tag || github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          # v4+ refuses a name that already exists, which a re-run of a
          # dispatched tag does (`workflow_dispatch` exists precisely to
          # exercise a tag again). Overwrite instead of failing the run.
          overwrite: true

      - name: Publish to the GitHub release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          # Upload what the build produced rather than re-stating its file
          # names: the arguments are the release, and a name invented here is a
          # second owner of `build_installer.ps1`'s naming rule.
          $files = @(Get-ChildItem -Path 'dist/release' -File |
            Select-Object -ExpandProperty FullName)
          if ($files.Count -ne 3) {
            throw "expected 3 release assets, found $($files.Count)"
          }
          # `gh release view` exits non-zero when the release does not exist
          # yet; a tag push creates it with the note, a manual run only
          # refreshes the assets.
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file $env:NOTES $files
          } else {
            gh release upload $tag $files --clobber
          }
