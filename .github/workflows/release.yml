name: release

# Publishing a tag *is* the release procedure: the three assets users download
# (setup exe, portable zip, sha256) are built here instead of by hand.
#
# Why this exists: the 2026-11-12 release was packaged manually and the manual
# path already produced both classic failure modes in this repo's history -- an
# asset that was never uploaded, and an asset built from a tree that had
# moved on since the tag. The build is deterministic from the tag
# (`git describe` is the version source in `scripts/build_installer.ps1`),
# so this job only has to start at the right commit and publish the bytes.
#
# Release notes are NOT generated: `docs/releases/release-<tag>.md` is a
# required input (the repo's own documentation rule). A tag without that
# file fails here rather than publishing an empty release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v2026.11.12"
        required: true
        type: string
      publish:
        description: "Upload the assets to the GitHub release"
        required: false
        type: boolean
        default: false

# Least privilege, plus the one write this job needs.
permissions:
  contents: write

# Serialise per tag: a re-run must not cancel the run it replaces.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # A manual run must build the tag it names, not whatever `github.ref`
          # happens to be (a branch, when dispatched from the UI).
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # No cache: this job's output is what users download, and a
          # poisoned pip cache would change the shipped bytes
          # (zizmor:cache-poisoning). ~40 s is not worth that.
          cache: false

      - name: Resolve version and release note
        shell: pwsh
        env:
          # Context data reaches the script through the environment only.
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}(\.\d+)?$') {
            throw "Unsupported tag format: $tag (want vYYYY.MM.DD[.N])"
          }
          $version = $tag.TrimStart('v')
          $notes = "docs/releases/release-$tag.md"
          if (-not (Test-Path $notes)) {
            throw "Missing release note $notes (one file per published tag)."
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "NOTES=$notes" >> $env:GITHUB_ENV
          Write-Host "tag=$tag version=$version notes=$notes"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      # Downloads the pinned CPython named by `scripts/runtime_manifest.json`,
      # checks its SHA-256 before extracting, then pip-installs
      # requirements.txt into it. A release build must not silently fall
      # back to `-SkipBundledPython`.
      - name: Stage the bundled CPython runtime
        shell: pwsh
        run: .\scripts\stage_python_runtime.ps1 -RepoRoot .

      - name: Build installer + portable zip
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version $env:VERSION

      # The checksum file is generated by the build script; this proves the
      # three files agree before anything is published.
      - name: Verify the assets against their checksums
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'dist/release'
          $manifest = Join-Path $dir "GPT-Register-Tool-$env:VERSION.sha256.txt"
          Get-Content $manifest | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0]
            $name = $parts[1].Trim()
            $path = Join-Path $dir $name
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash
            if ($actual -ne $expected) { throw "checksum mismatch: $name" }
            Write-Host "ok $name"
          }

      # Always keep the bytes, even for a dry run: the desktop host is built for
      # win-x64 and nobody can rebuild an installer from a log.
      # v5; Dependabot moves the digest and keeps this comment.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: package-${{ inputs.tag || github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the GitHub release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $files = @(
            (Join-Path 'dist/release' "GPT-Register-Tool-Setup-$tag.exe"),
            (Join-Path 'dist/release' "GPT-Register-Tool-win-x64-$tag.zip"),
            (Join-Path 'dist/release' "GPT-Register-Tool-$tag.sha256.txt")
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing asset $f" }
          }
          # `gh release view` exits non-zero when the release does not exist
          # yet; a tag push creates it with the note, a manual run only
          # refreshes the assets.
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file $env:NOTES $files
          } else {
            gh release upload $tag $files --clobber
          }
