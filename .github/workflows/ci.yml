name: ci

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to avoid queueing the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # Hard ceiling so a stuck step fails fast instead of burning the 6h GitHub limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # No NuGet package caching.
          #
          # `cache: true` requires a packages.lock.json at the *repository root*
          # and hard-fails with "Dependencies lock file is not found" when there
          # is none. This repo's only lock file lives at
          # scripts/installer/packages.lock.json, and pointing
          # cache-dependency-path at it would key the whole build cache off the
          # installer project alone — SmsWorkbench could change dependencies and
          # still get a stale cache.
          #
          # Enabling a root lock file is not a small change either: `dotnet test`
          # restores without a RID while the publish script restores with
          # -r win-x64, and those two want opposite lock contents (that was the
          # NU1004 break). Restore here costs ~18s, so caching is not worth
          # reintroducing that class of failure.
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - shell: powershell
        run: Copy-Item config.example.json config.json
      - shell: powershell
        run: .\scripts\environment_preflight.ps1
      - run: python -m compileall -q sms_tool services
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q --cov=sms_tool --cov=services --cov-report=term-missing
      - run: dotnet test GPTRegisterTool.slnx -c Release
      - run: python -c "import sms_tool.cli"
      - run: python -m pytest -q tests/test_protocol_payment_common.py tests/test_wallet_provider.py tests/test_wallet_manager_integration.py
      # Secret gates — precommit_guard is the hard gate (non-zero on tracked-file violation);
      # the other two are informational scanners that print findings.
      - name: Secret scan — tracked files (gate)
        run: python scripts/precommit_guard.py --all
      - name: Secret scan — hardcoded credentials in source
        run: python scripts/scan_hardcoded_secrets.py
      - name: Secret scan — git history
        run: python scripts/scan_sensitive_history.py config.json proxy.json runtime.json payment.json mailbox_tokens.txt kyl_state.json
      - run: python scripts/sensitive_field_scan.py
      - run: python scripts/architecture_scan.py
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\SmsWorkbench\build_dotnet.ps1
