# Dependabot: weekly, grouped, and quiet.
#
# Why this exists: the repository ships a bundled CPython plus a WPF host, so
# every shipped binary is a copy of whatever `requirements.txt` / the four
# `packages.lock.json` files said on release day. Before this file nothing
# watched them — `security_and_analysis.dependabot_security_updates` was
# disabled as well, so a CVE in `curl_cffi` (the TLS impersonation layer) or in
# `Microsoft.Extensions.*` reached a published installer with no signal at all.
#
# Grouping is deliberate: minor+patch bumps arrive as one PR per ecosystem,
# so the gate stays readable, while a major bump still gets its own PR --
# those are the ones where a human must decide whether a `curl_cffi`
# impersonation change is worth re-running the protocol suite for.
#
# `open-pull-requests-limit: 1` per ecosystem is deliberate: every open
# dependency PR costs a full Windows CI run, so a queue of six at once is
# how the lane looks stuck. One at a time keeps review honest.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    # `camoufox` (0.5.x) caps `playwright<1.63`, so a playwright bump beyond
    # 1.62 can never resolve while that cap stands -- the grouped PR #18 did
    # exactly that and failed at `pip install` with ResolutionImpossible.
    # Remove this ignore when camoufox ships a version requiring >=1.63.
    ignore:
      - dependency-name: playwright

  - package-ecosystem: nuget
    directory: "/SmsWorkbench"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      nuget-desktop-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "dotnet"]

  - package-ecosystem: nuget
    directory: "/SmsWorkbench.Contracts"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      nuget-contracts-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "dotnet"]

  - package-ecosystem: nuget
    directory: "/tests/SmsWorkbench.Tests"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      nuget-tests-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "dotnet"]

  - package-ecosystem: nuget
    directory: "/scripts/installer"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      nuget-installer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "dotnet"]

  # The three workflow actions are pinned by commit SHA (see ci.yml) because
  # `sha_pinning_required` is on; only Dependabot may move them, and it keeps
  # `# v5` comment in place when it does.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
